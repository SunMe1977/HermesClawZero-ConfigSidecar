services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
      args:
        PGVECTOR_IMAGE: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.0-pg17}
    container_name: hc-sidecar-postgres
    restart: unless-stopped
    ports:
      - "5666:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: gbrain
      # Prevent re-init on container restart (must match existing cluster)
      PGUSER: postgres
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Backup script for safety before auto-update rebuilds
      - ./migrations/backup_db.sh:/docker-entrypoint-initdb.d/99-backup.sh:ro
      # Pre-rebuild backup exports (survives container rebuild)
      - pg_backups:/var/lib/postgresql/backups
    # NOTE: archive_mode/archive_command removed — WAL archiving (PITR) to a pgwal volume
    # failed silently (volume was root-owned; postgres uid 999 had no write permission),
    # leaving WAL segments stuck as .ready forever -> pg_wal grew unbounded (52 GB) and
    # filled the whole disk. Single-node memory DB: no PITR needed, regular backups exist
    # via pg_backups volume. max_wal_size=4GB now lets PostgreSQL recycle WAL normally
    # after each checkpoint, so pg_wal stays bounded.
    command: >
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c effective_cache_size=4GB
      -c maintenance_work_mem=512MB
      -c random_page_cost=1.1
      -c max_parallel_workers_per_gather=4
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c wal_level=replica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gbrain"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
      args:
        DB_PASSWORD_ARG: ${DB_PASSWORD:?DB_PASSWORD is required}
    container_name: hc-sidecar-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    container_name: hc-sidecar-redis
    restart: unless-stopped
    # SECURITY 2026-10-25: was "6379:6379" (0.0.0.0) and no auth — a Redis
    # replication attack (REPLICAOF) on 13 Jul corrupted the RDB. Now bound to
    # loopback only, password required, and REPLICAOF/REPLCONF disabled.
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --rename-command REPLICAOF ""
      --rename-command REPLCONF ""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  api1: &api-base
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /root/workspace/hc-sidecar:/app/repo
      - /root/workspace/hc-sidecar/sync:/app/sync
      - ${HERMES_DB_PATH_DIR:-/root/.hermes}:/hermes_state:ro
      # Access pre-rebuild backups for startup recovery
      - pg_backups:/var/lib/postgresql/backups
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: gbrain
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MIN: ${DB_POOL_MIN:-10}
      DB_POOL_MAX: ${DB_POOL_MAX:-100}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_URL: ${API_URL:-}
      API_KEY: ${API_KEY:?API_KEY is required}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-DagD2b1Jg+ZSzVoaaL5/MdzcNJvro4jnUpIXi9Fm2S4=}
      AI_PROVIDER: ${COMPOSE_AI_PROVIDER:-${AI_PROVIDER:-openrouter}}
      EMBEDDING_PROVIDER: auto
      EMBEDDING_DIM: ${EMBEDDING_DIM:-}
      ALLOW_EMBEDDING_SCHEMA_RESET: "true"
      HERMES_DB_PATH: /hermes_state/state.db
      UPDATE_REPO_DIR: /app/repo
      UPDATE_REMOTE: ${AUTO_UPDATE_REMOTE:-origin}
      UPDATE_BRANCH: ${AUTO_UPDATE_BRANCH:-main}
      UPDATE_RESTART_COMMAND: ${UPDATE_RESTART_COMMAND:-}
      SYNC_DIR: ${SYNC_DIR}
      OLLAMA_HOST: ${OLLAMA_HOST}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/version', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 35s

  api2:
    <<: *api-base

  caddy:
    image: caddy:2-alpine
    container_name: hc-sidecar-caddy
    restart: unless-stopped
    ports:
      - "8010:8010"
    depends_on:
      - api1
      - api2
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8010/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    profiles: ["ollama"]
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: hc-sidecar-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  ollama_data:
  caddy_data:
  pg_backups:
